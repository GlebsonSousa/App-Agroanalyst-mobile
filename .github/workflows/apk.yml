name: Gerar APK

on:
  push:
    branches: [main]
    paths: ['app-android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        working-directory: app-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/app/build/outputs/apk/debug/app-debug.apk app-agro.apk
          gh release create "v${{ github.run_number }}" app-agro.apk --title "versão ${{ github.run_number }}" --notes "APK do app AgroAnalyst Mobile" --latest
